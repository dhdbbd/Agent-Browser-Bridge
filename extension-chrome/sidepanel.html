<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZCode</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --line: #e6e8ec;
    --text: #1f2328;
    --dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eaf1ff;
    --ok: #16a34a;
    --bad: #dc2626;
    --card: #ffffff;
    --card-line: #e6e8ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1e2126;
      --line: #2f343b;
      --text: #e6e8ea;
      --dim: #9aa3ad;
      --accent: #4c8dff;
      --accent-soft: #1c2740;
      --ok: #3ecf8e;
      --bad: #ff6b6b;
      --card: #23272d;
      --card-line: #2f343b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; transition: .2s; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
  .brand { font-weight: 600; }
  .spacer { flex: 1; }
  .icon-btn {
    font: inherit; font-size: 12px;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 3px 8px; cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.locked {
    color: #fff;
    background: var(--bad);
    border-color: var(--bad);
    font-weight: 600;
  }
  .icon-btn.active {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* 隐藏工具调用过程：只保留用户消息与助手回复 */
  body.hide-tools .tool-row { display: none; }

  #pageBar {
    padding: 6px 12px;
    font-size: 11.5px; color: var(--dim);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: none;
  }

  #stream {
    flex: 1; overflow-y: auto;
    padding: 14px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #stream::-webkit-scrollbar { width: 6px; }
  #stream::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .row { display: flex; gap: 8px; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .row.user { justify-content: flex-end; }
  .row.reply { justify-content: flex-start; }

  .avatar {
    width: 22px; height: 22px; border-radius: 6px;
    background: #1f2937; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font: 700 11px/1 "Segoe UI", system-ui, sans-serif;
    flex: none; margin-top: 2px;
  }
  @media (prefers-color-scheme: dark) { .avatar { background: #e6e8ea; color: #16181c; } }

  .bubble {
    max-width: 82%;
    padding: 8px 11px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .row.reply .bubble {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--card-line);
  }

  .tool-card {
    max-width: 92%;
    border: 1px solid var(--card-line);
    background: var(--card);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .tool-head { display: flex; align-items: center; gap: 6px; }
  .tool-name { font-weight: 600; font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
  .tool-ms { margin-left: auto; color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .tool-detail { margin-top: 3px; color: var(--dim); overflow-wrap: anywhere; }
  .tool-detail:empty { display: none; }

  .spinner {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.6px solid var(--line);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tick { color: var(--ok); font-weight: 700; }
  .cross { color: var(--bad); font-weight: 700; }

  .sys {
    color: var(--dim);
    font-size: 11px;
    text-align: center;
    padding: 2px 0;
  }

  .working {
    display: flex; align-items: center; gap: 6px;
    color: var(--dim); font-size: 11.5px;
    padding: 2px 2px 10px;
  }
  .working .dots span {
    display: inline-block; width: 4px; height: 4px; margin-right: 2px;
    border-radius: 50%; background: var(--dim);
    animation: blink 1.2s infinite;
  }
  .working .dots span:nth-child(2) { animation-delay: .2s; }
  .working .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  footer {
    border-top: 1px solid var(--line);
    padding: 9px 10px 10px;
    background: var(--panel);
    flex: none;
  }
  .input-wrap {
    display: flex; align-items: flex-end; gap: 7px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    padding: 7px 8px;
    transition: border-color .15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; max-height: 120px; min-height: 20px; height: 20px;
    line-height: 1.5;
  }
  textarea::placeholder { color: var(--dim); }
  #send {
    flex: none;
    width: 28px; height: 28px; border-radius: 8px;
    border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  #send:disabled { opacity: .35; cursor: default; }
  .hint { margin-top: 6px; color: var(--dim); font-size: 10.5px; text-align: center; }
</style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <span class="brand">ZCode</span>
    <span class="spacer"></span>
    <button id="toggleTools" class="icon-btn" title="显示 / 隐藏工具调用过程">过程</button>
    <button id="lock" class="icon-btn" title="冻结模型的全部浏览器操作（连接不断）">锁定</button>
    <button id="clear" class="icon-btn" title="清空对话">清空</button>
  </header>

  <div id="pageBar">正在连接本地桥…</div>

  <div id="stream"></div>
  <div class="working" id="working" style="display:none">
    <div class="dots"><span></span><span></span><span></span></div>
    <span>工作中</span>
  </div>

  <footer>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="给 ZCode 发指令…"></textarea>
      <button id="send" title="发送 (Enter)">↑</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 发送后自动执行</div>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
